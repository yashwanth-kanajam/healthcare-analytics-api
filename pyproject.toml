[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-analytics-api"
version = "0.1.0"
description = "Read-only API for versioned healthcare analytical aggregates"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthcare_api = ["artifacts/v1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv*", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends(...) in a parameter default is FastAPI's documented dependency-injection
# idiom, not an accidental call-in-default.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Limitation, basis and description strings are returned verbatim in API
# responses; rewrapping them would change the response payloads.
"src/healthcare_api/app.py" = ["E501"]
"src/healthcare_api/service.py" = ["E501"]
